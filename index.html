<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhérents — TITAN Surf Club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="hero">
    <div class="hero-inner">
      <img src="logo.png" alt="Logo Titan Surf Club" class="hero-logo" onerror="this.style.display='none';">
      <div class="hero-text">
        <h1>TITAN Surf Club</h1>
        <p>Île de La Réunion — Toute Incapacité Trouve Adaptation Nécessaire</p>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="card" style="margin-bottom:20px;">
      <h3 style="font-size:.95rem; margin-bottom:12px;">Tableau de bord</h3>
      <table class="dash-table">
        <tbody id="dashTable">
          <tr><td colspan="2" class="empty-msg">Chargement...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="page-header">
      <div>
        <h1 style="font-size:1.3rem;">Adhérents</h1>
        <p class="subtitle" id="countLabel">Chargement...</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="calendrier.html" class="btn btn-primary">📅 Réservation</a>
        <button class="btn btn-secondary" id="addBtn">+ Ajouter un adhérent</button>
      </div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search" placeholder="Rechercher par nom, prénom, email...">
    </div>

    <div class="card scroll-x" style="padding:0;">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Contact</th>
            <th>Licence FFS</th>
            <th>Séances / accès</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="empty-msg">Chargement...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let adherents = [];
    let statsMap = {};
    let achatsByAdherent = {};

    async function load() {
      const [{ data: a }, { data: s }, { data: achats }] = await Promise.all([
        sb.from('adherents').select('*').order('nom'),
        sb.from('v_adherents_stats').select('*'),
        sb.from('achats').select('adherent_id, type, statut, date_paiement'),
      ]);
      adherents = a || [];
      statsMap = Object.fromEntries((s || []).map(x => [x.adherent_id, x]));
      achatsByAdherent = {};
      (achats || []).forEach(ac => {
        (achatsByAdherent[ac.adherent_id] = achatsByAdherent[ac.adherent_id] || []).push(ac);
      });

      renderDashboard(achats || []);
      render(adherents);
    }

    function renderDashboard(allAchats) {
      const actifs = adherents.filter(a => a.actif);

      let restantesTotal = 0;
      let aRelancer = 0;
      actifs.forEach(a => {
        const expiry = licenceAnnuelleActive(achatsByAdherent[a.id]);
        if (expiry) return; // illimité, ne compte pas dans "à relancer" ni dans le total de séances
        const n = statsMap[a.id]?.seances_restantes ?? 0;
        restantesTotal += n;
        if (n <= 0) aRelancer++;
      });

      const enAttente = allAchats.filter(x => x.statut === 'En attente').length;

      document.getElementById('dashTable').innerHTML = `
        <tr><td>Adhérents actifs</td><td>${actifs.length}</td></tr>
        <tr><td>Séances restantes (total, hors licence illimitée)</td><td>${restantesTotal}</td></tr>
        <tr><td>Solde à 0 ou négatif (hors licence illimitée)</td><td>${aRelancer}</td></tr>
        <tr><td>Paiements en attente (carnets, séances, licences)</td><td>${enAttente}</td></tr>
      `;
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      document.getElementById('countLabel').textContent = `${adherents.length} adhérent(s) enregistré(s)`;
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Aucun adhérent trouvé.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(a => {
        const st = statsMap[a.id];
        const expiry = licenceAnnuelleActive(achatsByAdherent[a.id]);
        const seancesCell = expiry
          ? `<span class="badge badge-illimite">Illimité jusqu'au ${fmtDateObj(expiry)}</span>`
          : `<span class="badge ${statutSeances(st?.seances_restantes).cls}">${statutSeances(st?.seances_restantes).label}</span>`;
        return `
          <tr class="clickable" onclick="location.href='adherent.html?id=${a.id}'">
            <td style="font-weight:700; color:var(--marine);">${a.nom} ${a.prenom}</td>
            <td>
              <div>${a.email || '—'}</div>
              <div class="text-muted" style="font-size:.82rem;">${a.telephone || ''}</div>
            </td>
            <td>${a.licence ? '✅' : '—'}</td>
            <td>${seancesCell}</td>
            <td>${a.actif ? '<span class="badge badge-vert">Actif</span>' : '<span class="badge badge-neutral">Inactif</span>'}</td>
          </tr>`;
      }).join('');
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return render(adherents);
      render(adherents.filter(a => `${a.nom} ${a.prenom} ${a.email || ''}`.toLowerCase().includes(q)));
    });

    document.getElementById('addBtn').addEventListener('click', async () => {
      const { data, error } = await sb.from('adherents').insert({ nom: 'Nouvel', prenom: 'Adhérent' }).select().single();
      if (!error) window.location.href = `adherent.html?id=${data.id}`;
    });

    (async function init() {
      const session = await requireAuth();
      if (!session) return;
      initNav('accueil');
      await load();
    })();
  </script>
</body>
</html>
